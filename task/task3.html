<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Промо-блок</title>
<style>
  body {
    margin: 0;
    padding: 20px;
    font-family: system-ui, sans-serif;
  }

  .promo {
    padding: 20px;
    border-radius: 12px;
    background-color: #14213d;
    background-image: url("promo-bg.jpg");
    background-size: cover;
    background-position: center;
    color: #fff;
  }

  .promo__title {
    margin: 0 0 8px;
    font-size: 36px;
  }

  .promo__text {
    margin: 0 0 16px;
    font-size: 16px;
  }

  .promo__link {
    color: #ffd43b;
  }

  .promo__link:hover {
    color: #fff;
  }
</style>
</head>
<body>
  <section class="promo">
    <h2 class="promo__title">Скидки до 50%</h2>
    <p class="promo__text">Только до воскресенья</p>
    <a class="promo__link" href="/sale">Подробнее</a>
  </section>
</body>
</html>
