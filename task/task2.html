<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карточка товара</title>
<style>
  body {
    margin: 0;
    padding: 20px;
    font-family: system-ui, sans-serif;
    background: #f3f3f3;
  }

  .product-card {
    width: 280px;
    border: 1px solid #ddd;
    border-radius: 12px;
    overflow: hidden;
    background: #fff;
  }

  .product-card__image {
    width: 100%;
    display: block;
  }

  .product-card__info {
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .product-card__title {
    margin: 0;
    font-size: 22px;
    font-weight: bold;
  }

  .product-card__price {
    margin: 0;
    color: #e53935;
    font-weight: 600;
  }

  .product-card__price_old {
    color: #bbb;
    text-decoration: line-through;
    font-weight: 400;
  }

  .product-card__button {
    align-self: flex-start;
    padding: 10px 16px;
    border: 0;
    border-radius: 6px;
    background: #3b57d4;
    color: #fff;
    cursor: pointer;
  }
</style>
</head>
<body>
  <main>
    <article class="product-card">
      <img class="product-card__image" src="laptop.jpg" alt="Ноутбук Pro 14">
      <div class="product-card__info">
        <h3 class="product-card__title">Ноутбук Pro 14</h3>
        <p class="product-card__price">89 990 ₽</p>
        <p class="product-card__price product-card__price_old">99 990 ₽</p>
        <button class="product-card__button">В корзину</button>
      </div>
    </article>
  </main>
</body>
</html>
